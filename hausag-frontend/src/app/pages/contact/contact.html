<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 pt-32 fade-in text-white">
  <div class="text-center mb-16">
    <h1 class="text-5xl md:text-6xl font-serif font-medium text-white tracking-wide">Contáctanos</h1>
    <p class="mt-4 text-xl text-white/70 font-extralight tracking-wide">Estamos aquí para asesorarte en tu próximo proyecto.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
    <!-- Formulario -->
    <div class="bg-black-surface/70 backdrop-blur-md p-8 md:p-12 rounded-2xl border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
      <h3 class="text-3xl font-serif font-medium text-white mb-8 tracking-wide">Envíanos un mensaje</h3>
      <form class="space-y-6 font-extralight">
        <div>
          <label for="name" class="block text-sm text-white/70 tracking-wide mb-2">Nombre completo</label>
          <input type="text" id="name" class="block w-full bg-black-pure/50 border border-white/10 text-white rounded-md focus:border-white/50 focus:ring-0 p-3 transition-colors">
        </div>
        <div>
          <label for="email" class="block text-sm text-white/70 tracking-wide mb-2">Correo electrónico</label>
          <input type="email" id="email" class="block w-full bg-black-pure/50 border border-white/10 text-white rounded-md focus:border-white/50 focus:ring-0 p-3 transition-colors">
        </div>
        <div>
          <label for="message" class="block text-sm text-white/70 tracking-wide mb-2">Mensaje</label>
          <textarea id="message" rows="4" class="block w-full bg-black-pure/50 border border-white/10 text-white rounded-md focus:border-white/50 focus:ring-0 p-3 transition-colors"></textarea>
        </div>
        <button type="button" class="w-full flex justify-center py-4 px-4 border border-white/30 rounded-md shadow-sm text-xs font-bold uppercase tracking-[0.2em] text-white hover:bg-white hover:text-black-pure focus:outline-none transition-all duration-300 mt-8">
          Enviar Mensaje
        </button>
      </form>
    </div>

    <!-- Info de Contacto Directa -->
    <div class="flex flex-col justify-center">
      <div class="bg-black-surface/70 backdrop-blur-md p-8 md:p-12 border border-white/10 rounded-2xl h-full shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
        <h3 class="text-3xl font-serif font-medium text-white mb-10 tracking-wide">Información Directa</h3>
        
        <div class="space-y-10 font-extralight">
          <div class="flex items-start">
            <div class="flex-shrink-0 mt-1">
              <svg class="h-6 w-6 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
            </div>
            <div class="ml-4 text-base text-white/70">
              <p class="font-serif text-lg text-white mb-1">Teléfono / WhatsApp</p>
              <p>+54 9 11 1234-5678</p>
            </div>
          </div>

          <div class="flex items-start">
            <div class="flex-shrink-0 mt-1">
              <svg class="h-6 w-6 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <div class="ml-4 text-base text-white/70">
              <p class="font-serif text-lg text-white mb-1">Email</p>
              <p>contacto@hausag.ejemplo.com</p>
            </div>
          </div>
          
          <div class="flex items-start">
            <div class="flex-shrink-0 mt-1">
              <svg class="h-6 w-6 text-white/50" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            </div>
            <div class="ml-4 text-base text-white/70">
              <p class="font-serif text-lg text-white mb-1">Instagram</p>
              <p>@hausag_oficial</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
