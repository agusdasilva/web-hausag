<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 pb-16 fade-in transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black-pure' : 'text-white'">
  <div class="text-center mb-16">
    <h1 class="text-5xl md:text-6xl font-serif font-medium tracking-wide transition-colors duration-300"
        [ngClass]="theme === 'light' ? 'text-black' : 'text-white'">Contáctanos</h1>
    <p class="mt-4 text-xl font-extralight tracking-wide transition-colors duration-300"
       [ngClass]="theme === 'light' ? 'text-black' : 'text-white/70'">Estamos aquí para asesorarte en tu próximo proyecto.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
    <!-- Formulario -->
    <div class="p-8 md:p-12 rounded-2xl border transition-colors duration-300"
         [ngClass]="theme === 'light' ? 'bg-neutral-100 border-black/10 shadow-[0_20px_50px_rgba(0,0,0,0.08)]' : 'bg-black-surface border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.5)]'">
      <h3 class="text-3xl font-serif font-medium mb-8 tracking-wide transition-colors duration-300"
          [ngClass]="theme === 'light' ? 'text-black' : 'text-white'">Envíanos un mensaje</h3>
      <form class="space-y-6 font-extralight">
        <div>
          <label for="name" class="block text-sm tracking-wide mb-2 transition-colors duration-300"
                 [ngClass]="theme === 'light' ? 'text-black' : 'text-white/70'">Nombre completo</label>
          <input type="text" id="name" class="block w-full border rounded-md focus:ring-0 p-3 transition-colors duration-300"
                 [ngClass]="theme === 'light' ? 'bg-white border-black/20 text-black focus:border-black' : 'bg-black-pure border-white/10 text-white focus:border-white/50'">
        </div>
        <div>
          <label for="email" class="block text-sm tracking-wide mb-2 transition-colors duration-300"
                 [ngClass]="theme === 'light' ? 'text-black' : 'text-white/70'">Correo electrónico</label>
          <input type="email" id="email" class="block w-full border rounded-md focus:ring-0 p-3 transition-colors duration-300"
                 [ngClass]="theme === 'light' ? 'bg-white border-black/20 text-black focus:border-black' : 'bg-black-pure border-white/10 text-white focus:border-white/50'">
        </div>
        <div>
          <label for="message" class="block text-sm tracking-wide mb-2 transition-colors duration-300"
                 [ngClass]="theme === 'light' ? 'text-black' : 'text-white/70'">Mensaje</label>
          <textarea id="message" rows="4" class="block w-full border rounded-md focus:ring-0 p-3 transition-colors duration-300"
                    [ngClass]="theme === 'light' ? 'bg-white border-black/20 text-black focus:border-black' : 'bg-black-pure border-white/10 text-white focus:border-white/50'"></textarea>
        </div>
        <button type="button" class="w-full flex justify-center py-4 px-4 border rounded-md shadow-sm text-xs font-bold uppercase tracking-[0.2em] focus:outline-none transition-all duration-300 mt-8"
                [ngClass]="theme === 'light' ? 'bg-black text-white hover:bg-black/80 border-transparent' : 'border-white/30 text-white hover:bg-white hover:text-black-pure'">
          Enviar Mensaje
        </button>
      </form>
    </div>

    <!-- Info de Contacto Directa -->
    <div class="flex flex-col justify-center">
      <div class="p-8 md:p-12 border rounded-2xl h-full transition-colors duration-300"
           [ngClass]="theme === 'light' ? 'bg-neutral-100 border-black/10 shadow-[0_20px_50px_rgba(0,0,0,0.08)]' : 'bg-black-surface border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.5)]'">
        <h3 class="text-3xl font-serif font-medium mb-10 tracking-wide transition-colors duration-300"
            [ngClass]="theme === 'light' ? 'text-black' : 'text-white'">Información Directa</h3>
        <div class="space-y-10 font-extralight">
          
          <div class="flex items-start">
            <div class="flex-shrink-0 mt-1 transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black/60' : 'text-white/50'">
              <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <div class="ml-4 text-base transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black' : 'text-white/70'">
              <p class="font-serif text-lg mb-1 transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black' : 'text-white'">Showroom & Salón de Ventas</p>
              <p>Av. Jara 866 — Mar del Plata (El Águila Sanitarios)</p>
            </div>
          </div>

          <div class="flex items-start">
            <div class="flex-shrink-0 mt-1 transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black/60' : 'text-white/50'">
              <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
            </div>
            <div class="ml-4 text-base transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black' : 'text-white/70'">
              <p class="font-serif text-lg mb-1 transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black' : 'text-white'">Teléfono / WhatsApp</p>
              <p>+54 9 2236 34-8144</p>
            </div>
          </div>

          <div class="flex items-start">
            <div class="flex-shrink-0 mt-1 transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black/60' : 'text-white/50'">
              <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <div class="ml-4 text-base transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black' : 'text-white/70'">
              <p class="font-serif text-lg mb-1 transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black' : 'text-white'">Email</p>
              <p>contacto@hausag.ejemplo.com</p>
            </div>
          </div>
          
          <div class="flex items-start">
            <div class="flex-shrink-0 mt-1 transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black/60' : 'text-white/50'">
              <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            </div>
            <div class="ml-4 text-base transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black' : 'text-white/70'">
              <p class="font-serif text-lg mb-1 transition-colors duration-300" [ngClass]="theme === 'light' ? 'text-black' : 'text-white'">Instagram</p>
              <p>@hausag_oficial</p>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
