<div class="flex flex-col min-h-screen transition-all duration-700" 
     [ngStyle]="{
       'background-image': theme === 'light' 
         ? 'url(\'/assets/images/textura-marmol-blanco-fondo_42682-286.avif\')' 
         : 'url(\'/assets/images/dark_texture.webp\')',
       'background-attachment': 'fixed',
       'background-size': 'cover',
       'background-position': 'center'
     }">
  <app-header></app-header>
  <main class="flex-grow" [class.pt-24]="!hasHeroBanner">
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
</div>
