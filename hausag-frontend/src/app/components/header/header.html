<header class="fixed w-full top-0 z-50 border-b transition-all duration-300"
        [ngStyle]="headerStyle">
  <div class="w-full px-6 md:px-12 lg:px-16">
    <div class="flex justify-between items-center h-24">
      
      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center md:ml-4">
        <a routerLink="/" class="flex items-center">
          <img src="/assets/images/hausag_header.webp" alt="Hausag Logo" class="h-14 w-auto mix-blend-screen">
        </a>
      </div>

      <!-- Right Side: Navigation & Cart -->
      <div class="flex items-center gap-6 md:mr-4">
        <!-- Desktop Menu -->
        <nav class="hidden md:flex space-x-2">
          <a routerLink="/" class="text-white/90 hover:text-white hover:bg-black-elevated px-4 py-2 rounded-md text-sm font-semibold tracking-wider uppercase transition-all">Inicio</a>
          <a routerLink="/catalogo" class="text-white/90 hover:text-white hover:bg-black-elevated px-4 py-2 rounded-md text-sm font-semibold tracking-wider uppercase transition-all">Catálogo</a>
          <a routerLink="/nosotros" class="text-white/90 hover:text-white hover:bg-black-elevated px-4 py-2 rounded-md text-sm font-semibold tracking-wider uppercase transition-all">Nosotros</a>
          <a routerLink="/faq" class="text-white/90 hover:text-white hover:bg-black-elevated px-4 py-2 rounded-md text-sm font-semibold tracking-wider uppercase transition-all">FAQ</a>
          <a routerLink="/contacto" class="text-white/90 hover:text-white hover:bg-black-elevated px-4 py-2 rounded-md text-sm font-semibold tracking-wider uppercase transition-all">Contacto</a>
        </nav>

        <!-- Theme Toggle -->
        <button (click)="toggleTheme()" class="text-white/90 hover:text-white p-2 transition-colors relative focus:outline-none ml-2" title="Alternar tema">
          <svg class="w-6 h-6 transition-transform duration-700 ease-in-out" [ngClass]="{'rotate-[360deg] text-yellow-300': theme === 'light', 'rotate-0': theme === 'dark'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <mask id="moon-mask">
              <rect x="0" y="0" width="100%" height="100%" fill="white" />
              <circle class="transition-all duration-700 ease-in-out" fill="black" 
                      [attr.cx]="theme === 'light' ? '30' : '15'" 
                      [attr.cy]="theme === 'light' ? '0' : '9'" 
                      [attr.r]="theme === 'light' ? '0' : '6'" />
            </mask>
            <circle cx="12" cy="12" mask="url(#moon-mask)" fill="currentColor" stroke="none" class="transition-all duration-700 ease-in-out"
                    [attr.r]="theme === 'light' ? '5' : '9'" />
            <g stroke="currentColor" stroke-width="2" class="transition-all duration-700 ease-in-out transform origin-center"
               [ngClass]="{'opacity-100 scale-100': theme === 'light', 'opacity-0 scale-50': theme === 'dark'}">
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </g>
          </svg>
        </button>

        <!-- Cart Icon -->
        <a routerLink="/carrito" class="relative text-white/90 hover:text-white p-2 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
          <span *ngIf="cartService.totalItems() > 0" class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-[10px] font-bold leading-none text-black-pure transform translate-x-1/4 -translate-y-1/4 bg-white rounded-full">
            {{ cartService.totalItems() }}
          </span>
        </a>

        <!-- Mobile menu button -->
        <div class="md:hidden flex items-center">
          <button (click)="toggleMenu()" class="text-white/70 hover:text-white focus:outline-none p-2 rounded-md hover:bg-black-elevated">
            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path *ngIf="!menuOpen" stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
              <path *ngIf="menuOpen" stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="menuOpen" class="md:hidden bg-black-pure/95 backdrop-blur-md border-t border-white/20 fade-in shadow-[0_10px_30px_rgba(0,0,0,0.8)]">
    <div class="px-4 pt-4 pb-6 space-y-2">
      <a routerLink="/" (click)="toggleMenu()" class="block text-white/80 hover:bg-black-elevated hover:text-white px-4 py-3 rounded-md text-base font-bold uppercase tracking-widest border border-transparent hover:border-black-border">Inicio</a>
      <a routerLink="/catalogo" (click)="toggleMenu()" class="block text-white/80 hover:bg-black-elevated hover:text-white px-4 py-3 rounded-md text-base font-bold uppercase tracking-widest border border-transparent hover:border-black-border">Catálogo</a>
      <a routerLink="/nosotros" (click)="toggleMenu()" class="block text-white/80 hover:bg-black-elevated hover:text-white px-4 py-3 rounded-md text-base font-bold uppercase tracking-widest border border-transparent hover:border-black-border">Nosotros</a>
      <a routerLink="/faq" (click)="toggleMenu()" class="block text-white/80 hover:bg-black-elevated hover:text-white px-4 py-3 rounded-md text-base font-bold uppercase tracking-widest border border-transparent hover:border-black-border">FAQ</a>
      <a routerLink="/contacto" (click)="toggleMenu()" class="block text-white/80 hover:bg-black-elevated hover:text-white px-4 py-3 rounded-md text-base font-bold uppercase tracking-widest border border-transparent hover:border-black-border">Contacto</a>
    </div>
  </div>
</header>
