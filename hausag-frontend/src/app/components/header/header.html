<header class="fixed w-full top-0 z-50 border-b transition-all duration-300"
        [ngStyle]="headerStyle">
  <div class="w-full px-6 md:px-12 lg:px-16">
    <div class="flex justify-between items-center h-20">
      
      <!-- Logo Interactivo Hausag -->
      <div class="flex-shrink-0 flex items-center md:ml-4">
        <a routerLink="/" class="group relative flex items-center select-none cursor-pointer" title="Hausag - Grifería de Calidad">
          
          <!-- Si es MODO OSCURO (Logo Original con bolitas) -->
          <div *ngIf="effectiveTheme === 'dark'" class="relative inline-block h-5 sm:h-6 md:h-7 w-auto" style="padding-top: 0.45rem; box-sizing: content-box;">
            <img src="/assets/images/hausag_header_letters.webp" 
                 alt="Hausag Logo" 
                 class="h-full w-auto block select-none pointer-events-none brightness-110">
            <span class="logo-ball ball-red absolute rounded-full bg-[#d62828]"
                  style="left: calc(39.88% - 1.6%); bottom: calc(100% + 0.12em); width: 3.23%; aspect-ratio: 1/1;"></span>
            <span class="logo-ball ball-blue absolute rounded-full bg-[#0047bb]"
                  style="left: calc(45.11% - 1.6%); bottom: calc(100% + 0.12em); width: 3.23%; aspect-ratio: 1/1;"></span>
            <span class="absolute top-full left-0 right-0 text-right pr-[1px]" style="white-space: nowrap;">
              <span class="text-[7px] sm:text-[7.5px] font-bold tracking-[0.22em] text-white/90 uppercase opacity-0 -translate-y-1 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 ease-out font-sans inline-block">
                GRIFERÍA DE CALIDAD
              </span>
            </span>
          </div>

          <!-- Si es MODO CLARO (misma estructura que modo oscuro, letras invertidas) -->
          <div *ngIf="effectiveTheme === 'light'" class="relative inline-block h-5 sm:h-6 md:h-7 w-auto" style="padding-top: 0.45rem; box-sizing: content-box;">
            <img src="/assets/images/hausag_header_letters.webp" 
                 alt="Hausag Logo Claro" 
                 class="h-full w-auto block select-none pointer-events-none"
                 style="filter: invert(1) brightness(0);">
            <span class="logo-ball ball-red absolute rounded-full bg-[#d62828]"
                  style="left: calc(39.88% - 1.6%); bottom: calc(100% + 0.12em); width: 3.23%; aspect-ratio: 1/1;"></span>
            <span class="logo-ball ball-blue absolute rounded-full bg-[#0047bb]"
                  style="left: calc(45.11% - 1.6%); bottom: calc(100% + 0.12em); width: 3.23%; aspect-ratio: 1/1;"></span>
            <span class="absolute top-full left-0 right-0 text-right pr-[1px]" style="white-space: nowrap;">
              <span class="text-[7px] sm:text-[7.5px] font-bold tracking-[0.22em] text-black/70 uppercase opacity-0 -translate-y-1 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 ease-out font-sans inline-block">
                GRIFERÍA DE CALIDAD
              </span>
            </span>
          </div>

        </a>
      </div>

      <!-- Right Side: Navigation & Cart -->
      <div class="flex items-center gap-6 md:mr-4">
        <!-- Desktop Menu -->
        <nav class="hidden md:flex space-x-2">
          <a routerLink="/" class="px-4 py-2 rounded-md text-sm font-semibold tracking-wider uppercase transition-all"
             [ngClass]="effectiveTheme === 'light' ? 'text-black/70 hover:text-black hover:bg-black/5' : 'text-white/90 hover:text-white hover:bg-black-elevated'">Inicio</a>
          <a routerLink="/catalogo" class="px-4 py-2 rounded-md text-sm font-semibold tracking-wider uppercase transition-all"
             [ngClass]="effectiveTheme === 'light' ? 'text-black/70 hover:text-black hover:bg-black/5' : 'text-white/90 hover:text-white hover:bg-black-elevated'">Catálogo</a>
          <a routerLink="/nosotros" class="px-4 py-2 rounded-md text-sm font-semibold tracking-wider uppercase transition-all"
             [ngClass]="effectiveTheme === 'light' ? 'text-black/70 hover:text-black hover:bg-black/5' : 'text-white/90 hover:text-white hover:bg-black-elevated'">Nosotros</a>
          <a routerLink="/faq" class="px-4 py-2 rounded-md text-sm font-semibold tracking-wider uppercase transition-all"
             [ngClass]="effectiveTheme === 'light' ? 'text-black/70 hover:text-black hover:bg-black/5' : 'text-white/90 hover:text-white hover:bg-black-elevated'">FAQ</a>
          <a routerLink="/contacto" class="px-4 py-2 rounded-md text-sm font-semibold tracking-wider uppercase transition-all"
             [ngClass]="effectiveTheme === 'light' ? 'text-black/70 hover:text-black hover:bg-black/5' : 'text-white/90 hover:text-white hover:bg-black-elevated'">Contacto</a>
        </nav>

        <!-- User Profile Dropdown -->
        <div class="relative ml-2">
          <button (click)="toggleUserMenu()" class="p-2 transition-colors focus:outline-none rounded-md" 
                  [ngClass]="effectiveTheme === 'light' ? 'text-black/70 hover:text-black hover:bg-black/5' : 'text-white/90 hover:text-white'" title="Mi Cuenta">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </button>
          
          <!-- Dropdown Menu (Mantiene su estilo independientemente del header) -->
          <div *ngIf="userMenuOpen" class="absolute right-0 mt-2 w-48 rounded-md shadow-[0_10px_30px_rgba(0,0,0,0.8)] bg-neutral-800 border border-white/10 divide-y divide-white/10 z-50">
            <!-- Menú si NO está logueado -->
            <div *ngIf="!currentUser" class="py-1">
              <a routerLink="/login" (click)="toggleUserMenu()" class="group flex items-center px-4 py-3 text-sm text-white/80 hover:bg-black-elevated hover:text-white font-medium transition-colors">
                Iniciar Sesión
              </a>
              <a routerLink="/registro" (click)="toggleUserMenu()" class="group flex items-center px-4 py-3 text-sm text-white/80 hover:bg-black-elevated hover:text-white font-medium transition-colors">
                Crear Cuenta
              </a>
            </div>

            <!-- Menú si SÍ está logueado -->
            <div *ngIf="currentUser" class="px-4 py-3">
              <p class="text-xs text-white/50 uppercase tracking-widest font-bold mb-1">Conectado como</p>
              <p class="text-sm font-medium text-white truncate">{{ currentUser.email }}</p>
            </div>
            <div *ngIf="currentUser" class="py-1">
              <a routerLink="/perfil" (click)="toggleUserMenu()" class="group flex items-center px-4 py-3 text-sm text-white/80 hover:bg-black-elevated hover:text-white font-medium transition-colors">
                Mi Perfil
              </a>
            </div>
            
            <div *ngIf="currentUser" class="py-1">
              <button (click)="logout()" class="w-full text-left group flex items-center px-4 py-3 text-sm text-red-400 hover:bg-red-500/10 hover:text-red-300 font-medium transition-colors">
                Cerrar Sesión
              </button>
            </div>

            <!-- Tema (Siempre visible) -->
            <div class="py-1 border-t border-white/10">
              <button (click)="toggleTheme(); toggleUserMenu()" class="w-full flex items-center px-4 py-3 text-sm text-white/80 hover:bg-black-elevated hover:text-white font-medium transition-colors">
                <svg class="mr-3 h-5 w-5 text-white/50 group-hover:text-white/80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <mask id="moon-mask-menu">
                    <rect x="0" y="0" width="100%" height="100%" fill="white" />
                    <circle [attr.cx]="theme === 'light' ? '30' : '15'" [attr.cy]="theme === 'light' ? '0' : '9'" [attr.r]="theme === 'light' ? '0' : '6'" fill="black" />
                  </mask>
                  <circle cx="12" cy="12" [attr.r]="theme === 'light' ? '5' : '9'" mask="url(#moon-mask-menu)" fill="currentColor" stroke="none" />
                </svg>
                Modo {{ theme === 'light' ? 'Oscuro' : 'Claro' }}
              </button>
            </div>
          </div>
        </div>

        <!-- Cart Icon -->
        <a routerLink="/carrito" class="relative p-2 transition-colors rounded-md"
           [ngClass]="effectiveTheme === 'light' ? 'text-black/70 hover:text-black hover:bg-black/5' : 'text-white/90 hover:text-white'">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
          <span *ngIf="cartService.totalItems() > 0" class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-[10px] font-bold leading-none transform translate-x-1/4 -translate-y-1/4 rounded-full"
                [ngClass]="effectiveTheme === 'light' ? 'bg-black text-white' : 'bg-white text-black-pure'">
            {{ cartService.totalItems() }}
          </span>
        </a>

        <!-- Mobile menu button -->
        <div class="md:hidden flex items-center">
          <button (click)="toggleMenu()" class="focus:outline-none p-2 rounded-md transition-colors"
                  [ngClass]="effectiveTheme === 'light' ? 'text-black/70 hover:text-black hover:bg-black/5' : 'text-white/70 hover:text-white hover:bg-black-elevated'">
            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path *ngIf="!menuOpen" stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
              <path *ngIf="menuOpen" stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="menuOpen" class="md:hidden border-t fade-in shadow-[0_10px_30px_rgba(0,0,0,0.8)]"
       [ngClass]="effectiveTheme === 'light' ? 'bg-white/95 backdrop-blur-md border-black/10' : 'bg-black-pure/95 backdrop-blur-md border-white/20'">
    <div class="px-4 pt-4 pb-6 space-y-2">
      <a routerLink="/" (click)="toggleMenu()" class="block px-4 py-3 rounded-md text-base font-bold uppercase tracking-widest border border-transparent transition-colors"
         [ngClass]="effectiveTheme === 'light' ? 'text-black/80 hover:bg-black/5 hover:text-black hover:border-black/10' : 'text-white/80 hover:bg-black-elevated hover:text-white hover:border-black-border'">Inicio</a>
      <a routerLink="/catalogo" (click)="toggleMenu()" class="block px-4 py-3 rounded-md text-base font-bold uppercase tracking-widest border border-transparent transition-colors"
         [ngClass]="effectiveTheme === 'light' ? 'text-black/80 hover:bg-black/5 hover:text-black hover:border-black/10' : 'text-white/80 hover:bg-black-elevated hover:text-white hover:border-black-border'">Catálogo</a>
      <a routerLink="/nosotros" (click)="toggleMenu()" class="block px-4 py-3 rounded-md text-base font-bold uppercase tracking-widest border border-transparent transition-colors"
         [ngClass]="effectiveTheme === 'light' ? 'text-black/80 hover:bg-black/5 hover:text-black hover:border-black/10' : 'text-white/80 hover:bg-black-elevated hover:text-white hover:border-black-border'">Nosotros</a>
      <a routerLink="/faq" (click)="toggleMenu()" class="block px-4 py-3 rounded-md text-base font-bold uppercase tracking-widest border border-transparent transition-colors"
         [ngClass]="effectiveTheme === 'light' ? 'text-black/80 hover:bg-black/5 hover:text-black hover:border-black/10' : 'text-white/80 hover:bg-black-elevated hover:text-white hover:border-black-border'">FAQ</a>
      <a routerLink="/contacto" (click)="toggleMenu()" class="block px-4 py-3 rounded-md text-base font-bold uppercase tracking-widest border border-transparent transition-colors"
         [ngClass]="effectiveTheme === 'light' ? 'text-black/80 hover:bg-black/5 hover:text-black hover:border-black/10' : 'text-white/80 hover:bg-black-elevated hover:text-white hover:border-black-border'">Contacto</a>
    </div>
  </div>
</header>
