<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end transition-all duration-500 ease-in-out"
     [ngClass]="{'opacity-0 translate-y-10 pointer-events-none': shouldHide, 'opacity-100 translate-y-0': !shouldHide}">
  
  <!-- Chat Window -->
  <div *ngIf="isOpen" 
       class="w-[350px] max-w-[calc(100vw-3rem)] h-[500px] max-h-[calc(100vh-6rem)] bg-white rounded-2xl shadow-2xl flex flex-col mb-4 overflow-hidden border border-neutral-200 transition-all duration-300 transform origin-bottom-right">
    
    <!-- Header -->
    <div class="bg-black text-white p-4 flex justify-between items-center shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shrink-0 p-1">
          <img src="assets/images/logo-black.png" alt="Hausag" class="w-full h-auto object-contain">
        </div>
        <div>
          <h3 class="font-bold text-sm">Asistente Virtual</h3>
          <p class="text-xs text-white/70">En línea</p>
        </div>
      </div>
      <button (click)="toggleChat()" class="text-white/70 hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Body / Messages -->
    <div #chatBody class="flex-1 overflow-y-auto p-4 bg-neutral-50 flex flex-col gap-3">
      <div *ngFor="let msg of messages" 
           class="max-w-[85%] p-3 rounded-2xl text-sm shadow-sm"
           [ngClass]="{
             'bg-black text-white self-end rounded-br-sm': msg.isUser,
             'bg-white text-black border border-neutral-200 self-start rounded-bl-sm': !msg.isUser,
             'border-red-300 text-red-600': msg.error
           }">
        {{ msg.text }}
      </div>
      
      <!-- Typing indicator -->
      <div *ngIf="isLoading" class="bg-white text-black border border-neutral-200 self-start rounded-2xl rounded-bl-sm p-4 shadow-sm">
        <div class="flex gap-1">
          <div class="w-2 h-2 bg-neutral-400 rounded-full animate-bounce"></div>
          <div class="w-2 h-2 bg-neutral-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
          <div class="w-2 h-2 bg-neutral-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="p-3 bg-white border-t border-neutral-200 shrink-0">
      <form (ngSubmit)="sendMessage()" class="flex gap-2">
        <input type="text" 
               [(ngModel)]="userInput" 
               name="message"
               placeholder="Escribe tu consulta aquí..." 
               class="flex-1 bg-neutral-100 text-black border-none rounded-full px-4 py-2.5 text-sm focus:ring-1 focus:ring-black outline-none"
               [disabled]="isLoading"
               autocomplete="off">
        <button type="submit" 
                [disabled]="!userInput.trim() || isLoading"
                class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center disabled:opacity-50 transition-opacity">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Floating Button -->
  <button (click)="toggleChat()" 
          class="chat-floating-btn w-14 h-14 bg-black text-white rounded-full shadow-[0_10px_25px_rgba(0,0,0,0.3)] flex items-center justify-center hover:scale-105 transition-transform">
    <svg *ngIf="!isOpen" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
    </svg>
    <svg *ngIf="isOpen" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
  </button>

</div>
