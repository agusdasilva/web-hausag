<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hausag | Próximamente</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Montserrat:wght@600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      background-image: url('./assets/dark_texture.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
    }
    
    .font-serif {
      font-family: 'Playfair Display', serif;
    }

    .font-sans {
      font-family: 'Inter', sans-serif;
    }

    /* Glassmorphism panel */
    .glass-panel {
      background: rgba(10, 10, 10, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Animations */
    .fade-in-up {
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    .delay-1 { animation-delay: 0.15s; }
    .delay-2 { animation-delay: 0.3s; }
    .delay-3 { animation-delay: 0.45s; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ─── Hausag Logo Interactivo & Animaciones ────────────────────────── */
    .logo-ball {
      will-change: transform;
    }

    .group:hover .ball-red {
      animation: swapRedOnce 0.55s linear forwards;
      box-shadow: 0 0 14px rgba(220, 38, 38, 0.9);
    }

    .group:hover .ball-blue {
      animation: swapBlueOnce 0.55s linear forwards;
      box-shadow: 0 0 14px rgba(0, 71, 187, 0.9);
    }

    /* Roja: arco por arriba → velocidad constante, suavidad dada por la curva */
    @keyframes swapRedOnce {
      0%   { transform: translate(0,    0)    scale(1);    }
      15%  { transform: translate(24%,  -28%) scale(1.05); }
      30%  { transform: translate(48%,  -50%) scale(1.1);  }
      50%  { transform: translate(81%,  -58%) scale(1.1);  }
      70%  { transform: translate(115%, -40%) scale(1.05); }
      85%  { transform: translate(140%, -15%) scale(1.02); }
      100% { transform: translate(162%,  0)   scale(1);    }
    }

    /* Azul: arco espejado por abajo */
    @keyframes swapBlueOnce {
      0%   { transform: translate(0,     0)   scale(1);    }
      15%  { transform: translate(-24%,  22%) scale(0.95); }
      30%  { transform: translate(-48%,  40%) scale(0.9);  }
      50%  { transform: translate(-81%,  48%) scale(0.9);  }
      70%  { transform: translate(-115%, 34%) scale(0.95); }
      85%  { transform: translate(-140%, 12%) scale(0.98); }
      100% { transform: translate(-162%,  0)  scale(1);    }
    }
  </style>
</head>
<body class="antialiased flex flex-col justify-center relative overflow-x-hidden overflow-y-auto min-h-[100dvh] py-8">

  <!-- Main Content -->
  <main class="relative z-10 w-full max-w-3xl mx-auto px-6 py-16 text-center">
    
    <div class="glass-panel rounded-2xl p-10 md:p-16 flex flex-col items-center">
      
      <!-- Logo Interactivo Hausag -->
      <div class="fade-in-up mb-10 w-full max-w-[280px] md:max-w-[340px] flex justify-center">
        <div class="group relative flex items-center select-none cursor-pointer w-full" title="Hausag - Grifería de Calidad">
          
          <!-- Contenedor de Letras Originales + Bolitas -->
          <div class="relative inline-block w-full" style="padding-top: 1.1rem; box-sizing: content-box;">
            <!-- Imagen Original de Letras HAUSAG -->
            <img src="./assets/hausag_header_letters.webp" 
                 alt="Hausag Logo" 
                 class="w-full h-auto block select-none pointer-events-none drop-shadow-2xl brightness-110">

            <!-- Bolita Izquierda (Roja) -->
            <span class="logo-ball ball-red absolute rounded-full bg-[#d62828]"
                  style="left: calc(39.88% - 1.6%); bottom: calc(100% + 0.12em); width: 3.23%; aspect-ratio: 1/1;"></span>

            <!-- Bolita Derecha (Azul) -->
            <span class="logo-ball ball-blue absolute rounded-full bg-[#0047bb]"
                  style="left: calc(45.11% - 1.6%); bottom: calc(100% + 0.12em); width: 3.23%; aspect-ratio: 1/1;"></span>

            <!-- Mensaje GRIFERÍA DE CALIDAD -->
            <span class="absolute top-full left-0 right-0 text-right pr-[1px] pt-1.5"
                  style="white-space: nowrap;">
              <span class="text-[9px] md:text-[11px] font-bold tracking-[0.24em] text-white/90 uppercase
                           opacity-0 -translate-y-1 group-hover:opacity-100 group-hover:translate-y-0
                           transition-all duration-300 ease-out font-sans inline-block"
                    style="font-family: 'Montserrat', 'Inter', sans-serif;">
                GRIFERÍA DE CALIDAD
              </span>
            </span>
          </div>

        </div>
      </div>

      <!-- Divider -->
      <div class="fade-in-up delay-1 w-16 h-[1px] bg-white/30 mb-10"></div>

      <!-- Headings -->
      <h1 class="fade-in-up delay-2 text-4xl md:text-5xl font-serif font-medium tracking-wide mb-6">
        Próximamente
      </h1>
      
      <p class="fade-in-up delay-3 text-lg md:text-xl font-sans font-light text-white/70 max-w-xl mx-auto leading-relaxed">
        Estamos preparando una nueva experiencia digital para ofrecerte lo mejor en griferías y soluciones de vanguardia.
      </p>

        </div>
      </div>

    </div>
  </main>

</body>
</html>
